basics:
  mass_bin: 1e10
  dir_out: "./data/outputs/"

  # tree_source: "file" (default) reads tree_file below, exactly as before.
  # tree_source: "pymctrees" instead generates a forest live via pymctrees
  # on every run (requires pymctrees installed separately -- see
  # ashvini/pymctrees_adapter.py -- and a pymctrees YAML config for
  # cosmology/dm_model/window_function_type, referenced via
  # pymctrees.config below, not duplicated here). No caching: tree
  # generation is fast enough (seconds for typical halo counts) that
  # regenerating each run is simpler than invalidation logic. For a forest
  # you want to reuse across many runs, build one offline instead with
  # scripts/build_trees_from_pymctrees.py and point tree_file at it.
  tree_source: "file"
  tree_file: "./data/inputs/merger_trees.h5"

  # pymctrees:
  #   config: "/path/to/pymctrees/config/planck2018_camb.yml"
  #   n_halos: 100
  #   z0: 5.0
  #   z_max: 20.0
  #   dz: 0.1
  #   m_res: null    # Msun; null -> 1e-3 * mass_bin
  #   backend: "numpy"   # or "numba"
  #   seed: null

star_formation:
  efficiency: 0.015

supernova:
  # type: "no" # "instantaneous", "no", "delayed" 
  type: "delayed" # "instantaneous", "no", "delayed" 
  # type: "instantaneous" # "instantaneous", "no", "delayed" 
  delay_time: 0.015 #Gyr
  epsilon_p: 5
  pi_fid: 1

reionization:
  UVB_enabled: True
  z_reion: 7
  gamma: 15
  omega: 2

metallicity:
  Z_IGM: 1.0e-3 #Z_solar units
  Z_yield: 0.06

dust:
  m_swept: 1.0e+3 #Swept-up mass in SNe; epsilon_d x M_ISM
  dust_yield: 0.004
  dust_gamma: 1.3e-4
  dust_alpha: 8
  m_crit: 1.0e+5

black_holes:
  efficiency: 0.001 # BH growth efficiency (gas_mass / t_ff units, same form as SF efficiency)
  eta_agn: 0.5 # AGN wind mass-loading efficiency: Mdot_wind = eta_agn * Mdot_BH
  eddington_multiplier: 1.0 # f_Edd: BH growth capped at f_Edd x the Eddington rate; >1 allows super-Eddington growth
  feedback_delay_time: 0.0 # Gyr; time lag between BH accretion and the AGN wind it powers. 0.0 = instantaneous (default)

  # growth_model: "pznk11_freefall" (default, the parameters above) or
  # "hobbs_slimdisk" -- the 2026 "Differential Growth" paper's alternative
  # nuclear-accretion/super-Eddington-cap/feedback model (enclosed-mass
  # free-fall a la Hobbs, Power, Nayakshin & King 2012; graded r_crit
  # slim-disc cap; King 2003 energy-driven AGN wind). See
  # ashvini/black_holes_growth_slimdisk.py and MODELS.md. Selecting
  # "hobbs_slimdisk" reads the slimdisk: block below instead of
  # efficiency/eddington_multiplier/eta_agn above.
  growth_model: "pznk11_freefall"
  # slimdisk:
  #   eta_acc: 0.005           # nuclear accretion efficiency
  #   R_nuc_pc: 100.0          # fixed nuclear radius, pc
  #   compaction_boost: 1.0    # fixed Phi_hat multiplier (>=1; no time-varying version here, see module docstring)
  #   r_crit: 8.0              # supply/standard-Eddington ratio threshold for the slim-disc cap
  #   epsilon_f: 5.0e-4        # King (2003) AGN wind coupling
  #   a_star: 0.5              # BH spin -> radiative efficiency via ashvini.spin.epsilon_from_spin

  # Optional replacement for the constant eta_agn coupling above: King
  # (2003, 2005) / Power, Zubovas, Nayakshin & King (2011) isothermal-sphere
  # M-sigma self-regulation. Mdot_wind = eta_agn * f_switch(M_BH/M_sigma) *
  # Mdot_BH instead of a constant eta_agn -- weak coupling while
  # M_BH < M_sigma(halo velocity dispersion), switching on smoothly once
  # M_BH >= M_sigma. See MODELS.md's "AGN feedback" section for the
  # equations. Off by default: enabled: False reproduces the constant
  # eta_agn behaviour exactly.
  sigma_feedback:
    enabled: False
    f_g: 0.16 # baryon fraction relative to dark matter (King 2003; Power et al. 2011)
    kappa_es: null # cm^2/g electron-scattering opacity; null -> physical sigma_thomson/m_p
    transition_width: 0.1 # dex width of the smooth M_BH/M_sigma switch
    # Hard growth cap at Power et al. (2011) eq. 21-22's predicted ceiling
    # (M_sigma * (1 + 0.41*sigma_200/h(z))) -- the actual "self-regulation"
    # (halts BH growth), as opposed to sigma_feedback.enabled above (which
    # only switches the wind's *strength*, and by itself does not cap
    # M_BH -- see MODELS.md). Requires sigma_feedback.enabled: True.
    growth_cap_enabled: False

  seeding:
    # Three independently enable-able seeding channels, checked in priority
    # order pop3 -> direct_collapse -> halo_mass_threshold; the first one
    # satisfied for a given halo wins. Z_gas_max thresholds are in the same
    # Z_solar units as metallicity.Z_IGM/Z_yield above.
    pop3:
      enabled: True
      z_min: 15 # only forms this early in the universe
      M_halo_min: 1.0e+6 # minihalo mass threshold (H2-cooling, Tvir ~ 1e4 K)
      Z_gas_max: 1.0e-4 # near-primordial gas required
      M_seed: 1.0e+2 # light seed: Pop III remnant mass

    direct_collapse:
      enabled: True
      z_min: 10
      M_halo_min: 1.0e+7 # atomic-cooling halo threshold
      Z_gas_max: 1.0e-5 # pristine gas required to suppress H2 fragmentation
      M_seed: 1.0e+5 # heavy seed

    halo_mass_threshold:
      enabled: True
      M_halo_min: 1.0e+10 # generic fallback: seed once the halo is massive enough
      M_seed: 1.0e+3
